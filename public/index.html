<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARAM Mayhem 전적 검색</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-theme="light">
    <div class="container">
        <header>
            <h1>칼바람: 아수라장 전적</h1>
            <button id="theme-btn">☀️</button>
        </header>

        <section class="search-section">
            <div class="search-box">
                <input type="text" id="riot-id" placeholder="닉네임 #KR1">
                <button id="search-btn">검색</button>
            </div>
        </section>

        <main id="result-container">
            <div class="placeholder">Riot ID를 입력하여 전적을 조회하세요.</div>
        </main>
    </div>
    <script src="main.js"></script>
</body>
</html>
